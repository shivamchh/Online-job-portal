# Production-grade HTTPS and Security Settings
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-stacktrace=never

# Strict Production Database: Fail fast on MySQL connection errors (No silent in-memory fallback)
app.db.fallback=false

# Disable automatic demo account seeding in production
app.seed.demo-data=false
