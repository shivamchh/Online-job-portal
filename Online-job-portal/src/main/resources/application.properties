spring.application.name=Online-job-portal

# Dynamic port for cloud hosting (Render, Railway, Fly.io, Heroku)
server.port=${PORT:8080}

# MySQL Database & Connection Pool Configuration via Environment Variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/online_job_portal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Defaults
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=JobSphereHikariPool

# In-memory database fallback flag (true for local test/demo, false in production)
app.db.fallback=${APP_DB_FALLBACK:true}

# Seed demo dataset flag (set to false in production)
app.seed.demo-data=${SEED_DEMO_DATA:true}

# Configurable persistent upload directory for candidate resumes
app.upload.dir=${UPLOAD_DIR:uploads}

# Security session timeout: 30 minutes, cookie-only (never append ;jsessionid to URLs)
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie

# Multipart configuration for resume uploads (cap at 2MB)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=5MB

# Actuator health endpoint for container & host monitoring
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
