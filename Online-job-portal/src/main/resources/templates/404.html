<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Page Not Found')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card border-0 shadow-lg text-center p-4 rounded-4">
                <div class="card-body">
                    <div class="mb-4">
                        <span class="d-inline-flex align-items-center justify-content-center bg-warning-subtle text-warning rounded-circle p-4">
                            <i class="bi bi-compass-fill fs-1"></i>
                        </span>
                    </div>
                    <h2 class="card-title fw-bold text-dark">404 - Page Not Found</h2>
                    <p class="text-muted mt-2">
                        The job listing, resource, or page you were looking for does not exist or may have been removed.
                    </p>
                    <div class="d-flex justify-content-center gap-2 mt-4">
                        <a href="/" class="btn btn-primary">
                            <i class="bi bi-house-door me-1"></i> Back to Home
                        </a>
                        <a href="/jobseeker/jobs" class="btn btn-outline-secondary">
                            <i class="bi bi-search me-1"></i> Browse Jobs
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
