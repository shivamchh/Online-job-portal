<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('My Job Postings')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="dashboard-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('my-jobs')}"></div>

    <main class="dashboard-content">
        <div class="container-fluid p-0">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold mb-1">My Posted Jobs</h2>
                    <p class="text-muted small mb-0">Search, filter, edit status, or soft-delete your company's career listings.</p>
                </div>
                <a href="/employer/post-job" class="btn btn-primary btn-sm">
                    <i class="bi bi-plus-circle me-1"></i> Post New Job
                </a>
            </div>

            <div th:replace="~{fragments/layout :: flashMessages}"></div>

            <div class="card border-0 shadow-sm rounded-3 bg-white p-3">
                <div class="table-responsive">
                    <table class="table table-hover align-middle datatable">
                        <thead class="table-light small text-uppercase">
                            <tr>
                                <th>ID</th>
                                <th>Job Title</th>
                                <th>Location</th>
                                <th>Type</th>
                                <th>Salary</th>
                                <th>Status</th>
                                <th class="text-end">Actions (Soft Delete)</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="job : ${jobs}">
                                <td class="font-monospace text-muted" th:text="${job.id}">1</td>
                                <td>
                                    <strong><span th:text="${job.title}">Senior Java Developer</span></strong>
                                    <div class="small text-muted text-truncate" style="max-width: 280px;" th:text="${job.requirements}">Java, Spring</div>
                                </td>
                                <td th:text="${job.location}">Bangalore</td>
                                <td>
                                    <span class="badge bg-light text-dark border" th:text="${job.jobType}">Full Time</span>
                                </td>
                                <td class="fw-semibold text-success" th:text="'$' + ${#numbers.formatDecimal(job.salary, 0, 'COMMA', 2, 'POINT')}">$85,000</td>
                                <td>
                                    <span th:if="${job.isActive()}" class="badge badge-status badge-open">OPEN</span>
                                    <span th:if="${!job.isActive()}" class="badge badge-status badge-closed" th:text="${job.status}">CLOSED</span>
                                </td>
                                <td class="text-end">
                                    <div class="d-inline-flex gap-1">
                                        <!-- Edit Job Button & Modal Trigger -->
                                        <button type="button" class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" th:data-bs-target="'#editJobModal' + ${job.id}" title="Edit job details">
                                            <i class="bi bi-pencil-square"></i> Edit
                                        </button>

                                         <form method="post" action="/servlet/jobs" class="d-inline">
                                            <input type="hidden" name="_csrf" th:value="${session.CSRF_TOKEN != null ? session.CSRF_TOKEN : _csrf}">
                                            <input type="hidden" name="action" value="toggle">
                                            <input type="hidden" name="id" th:value="${job.id}">
                                            <button th:if="${job.isActive()}" type="submit" class="btn btn-sm btn-outline-warning" title="Close job for new applicants">
                                                <i class="bi bi-pause-circle"></i> Pause
                                            </button>
                                            <button th:if="${!job.isActive()}" type="submit" class="btn btn-sm btn-outline-success" title="Reactivate job">
                                                <i class="bi bi-play-circle"></i> Reopen
                                            </button>
                                        </form>

                                        <form method="post" action="/servlet/jobs" class="d-inline">
                                            <input type="hidden" name="_csrf" th:value="${session.CSRF_TOKEN != null ? session.CSRF_TOKEN : _csrf}">
                                            <input type="hidden" name="action" value="delete">
                                            <input type="hidden" name="id" th:value="${job.id}">
                                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Mark inactive (soft delete preserving candidate applications)"
                                                    onclick="return confirm('Soft-delete this job? Applications will remain safely preserved.')">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>

                                    <!-- Edit Job Modal -->
                                    <div class="modal fade text-start" th:id="'editJobModal' + ${job.id}" tabindex="-1" aria-hidden="true">
                                        <div class="modal-dialog modal-lg">
                                            <div class="modal-content">
                                                <form method="post" action="/servlet/jobs">
                                                    <input type="hidden" name="_csrf" th:value="${session.CSRF_TOKEN != null ? session.CSRF_TOKEN : _csrf}">
                                                    <input type="hidden" name="action" value="update">
                                                    <input type="hidden" name="id" th:value="${job.id}">
                                                    <div class="modal-header">
                                                        <h5 class="modal-title fw-bold">
                                                            <i class="bi bi-pencil-square text-primary me-2"></i>Edit Job #<span th:text="${job.id}">1</span>
                                                        </h5>
                                                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                                    </div>
                                                    <div class="modal-body">
                                                        <div class="row g-3">
                                                            <div class="col-md-8">
                                                                <label class="form-label small fw-semibold">Job Title</label>
                                                                <input type="text" name="title" class="form-control" th:value="${job.title}" required>
                                                            </div>
                                                            <div class="col-md-4">
                                                                <label class="form-label small fw-semibold">Job Type</label>
                                                                <select name="jobType" class="form-select">
                                                                    <option value="Full Time" th:selected="${job.jobType == 'Full Time'}">Full Time</option>
                                                                    <option value="Part Time" th:selected="${job.jobType == 'Part Time'}">Part Time</option>
                                                                    <option value="Remote" th:selected="${job.jobType == 'Remote'}">Remote</option>
                                                                    <option value="Contract" th:selected="${job.jobType == 'Contract'}">Contract</option>
                                                                    <option value="Internship" th:selected="${job.jobType == 'Internship'}">Internship</option>
                                                                </select>
                                                            </div>
                                                            <div class="col-md-6">
                                                                <label class="form-label small fw-semibold">Location</label>
                                                                <input type="text" name="location" class="form-control" th:value="${job.location}" required>
                                                            </div>
                                                            <div class="col-md-6">
                                                                <label class="form-label small fw-semibold">Annual Salary ($)</label>
                                                                <input type="number" step="1000" name="salary" class="form-control" th:value="${job.salary}" required>
                                                            </div>
                                                            <div class="col-12">
                                                                <label class="form-label small fw-semibold">Required Skills & Keywords</label>
                                                                <input type="text" name="requirements" class="form-control" th:value="${job.requirements}" required>
                                                            </div>
                                                            <div class="col-12">
                                                                <label class="form-label small fw-semibold">Job Description</label>
                                                                <textarea name="description" rows="4" class="form-control" th:text="${job.description}" required></textarea>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div class="modal-footer">
                                                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                                                        <button type="submit" class="btn btn-primary">
                                                            <i class="bi bi-save me-1"></i> Save Changes
                                                        </button>
                                                    </div>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
