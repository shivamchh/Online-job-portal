<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Error')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card border-0 shadow-sm rounded-4 p-4 text-center">
                <div class="card-body">
                    <div class="stat-icon bg-warning-subtle text-warning mx-auto mb-3" style="width: 70px; height: 70px; font-size: 2rem;">
                        <i class="bi bi-shield-exclamation"></i>
                    </div>

                    <h3 class="fw-bold mb-2" th:text="${status != null ? 'Error ' + status : 'Unexpected Notice'}">Error Notice</h3>

                    <p class="text-muted mb-4" th:text="${message != null and !message.isEmpty() ? message : (error != null ? error : 'The requested operation could not be completed. Please refresh or retry.')}">
                        The requested action could not be completed. Please refresh and try again.
                    </p>

                    <div class="d-flex justify-content-center gap-2">
                        <a href="javascript:history.back()" class="btn btn-outline-secondary px-3">
                            <i class="bi bi-arrow-left me-1"></i> Go Back
                        </a>
                        <a href="/" class="btn btn-primary px-4 fw-semibold">
                            <i class="bi bi-house-door me-1"></i> Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
