<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Login')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <!-- Flash alerts -->
            <div th:if="${registered}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-1"></i> Registration successful! You can now log in.
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div th:if="${logout}" class="alert alert-info alert-dismissible fade show" role="alert">
                <i class="bi bi-info-circle-fill me-1"></i> You have logged out successfully.
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div th:if="${error != null and !error.isEmpty()}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-1"></i>
                <span th:text="${error}">Invalid email or password</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card border-0 shadow-sm rounded-4 p-4">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <div class="stat-icon bg-primary-subtle text-primary mx-auto mb-2">
                            <i class="bi bi-box-arrow-in-right"></i>
                        </div>
                        <h3 class="fw-bold">Sign In</h3>
                        <p class="text-muted small">Access your personalized portal dashboard</p>
                    </div>

                    <form id="loginForm" method="post" action="/servlet/login" class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" id="emailInput" name="email" class="form-control" placeholder="name@domain.com" required>
                                <div class="invalid-feedback">Please enter a valid email address.</div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" id="passwordInput" name="password" class="form-control" placeholder="Enter your password" required minlength="4">
                                <div class="invalid-feedback">Password is required (min 4 characters).</div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                            <i class="bi bi-door-open me-1"></i> Sign In
                        </button>
                    </form>

                    <!-- Quick Demo Credentials Helper -->
                    <div class="mt-4 pt-3 border-top">
                        <label class="small text-muted fw-bold d-block mb-2 text-center">Quick Fill Demo Accounts:</label>
                        <div class="d-flex justify-content-center gap-2">
                            <button type="button" class="btn btn-sm btn-outline-danger" onclick="fillCreds('admin@portal.com', 'admin123')">
                                Admin
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-primary" onclick="fillCreds('employer@techcorp.com', 'employer123')">
                                Employer
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-success" onclick="fillCreds('seeker@example.com', 'seeker123')">
                                Job Seeker
                            </button>
                        </div>
                    </div>

                    <div class="text-center mt-4">
                        <small class="text-muted">Don't have an account yet? <a href="/register" class="fw-bold">Create an Account</a></small>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
    function fillCreds(email, pass) {
        document.getElementById('emailInput').value = email;
        document.getElementById('passwordInput').value = pass;
    }

    // Client-side form validation check
    (function () {
        'use strict';
        var form = document.getElementById('loginForm');
        form.addEventListener('submit', function (event) {
            if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
            }
            form.classList.add('was-validated');
        }, false);
    })();
</script>
</body>
</html>
